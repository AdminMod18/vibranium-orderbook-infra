name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Rama/tag del repo de la app a probar (por defecto main)"
        default: main

jobs:
  # Rápido y sin cluster: compila cada overlay, valida el esquema de Kubernetes y las políticas del repo.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform (versión fijada)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - run: scripts/validate.sh

  # Prueba de extremo a extremo REAL: cluster kind, ingress, imagen construida del repo de la app, humo y caos.
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar acceso al repo de la app (secreto APP_REPO_TOKEN)
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Diagnóstico claro y sin imprimir nunca el valor del secreto.
          repo=AdminMod18/vibranium-orderbook-meli
          if [ -z "$APP_REPO_TOKEN" ]; then
            if git ls-remote --exit-code "https://github.com/$repo" HEAD >/dev/null 2>&1; then
              echo "El repo de la app es público: no hace falta token."; exit 0
            fi
            echo "::error::El secreto APP_REPO_TOKEN NO está disponible en este repositorio y el repo de la app es privado. Créalo en Settings > Secrets and variables > Actions > pestaña 'Repository secrets' DE ESTE repo (vibranium-orderbook-infra), con ese nombre exacto."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $APP_REPO_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo")
          echo "APP_REPO_TOKEN presente (${#APP_REPO_TOKEN} caracteres); lectura del repo de la app: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::El token existe pero GitHub responde HTTP $code al leer $repo: revisa que sea un token fino con 'Repository access' = vibranium-orderbook-meli y 'Contents: Read-only', y que no haya caducado."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: AdminMod18/vibranium-orderbook-meli
          ref: ${{ inputs.app_ref || 'main' }}
          path: app
          # Si el repo de la app es PRIVADO, el token por defecto no puede leerlo: defina el secreto APP_REPO_TOKEN
          # (token de acceso fino con permiso de solo lectura de contenido sobre ese repo). Con el repo público no hace falta.
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}
      - name: Cluster kind + ingress-nginx
        run: scripts/kind-up.sh
      - name: Construir y cargar la imagen de la app
        run: APP_DIR="$PWD/app" scripts/build-image.sh
      - name: Desplegar ambiente local
        run: scripts/deploy.sh local
      - name: Prueba de humo (ingress, ciclo de órdenes, observabilidad)
        run: scripts/smoke.sh
      - name: Caos 1 - crash del pod bajo estado no trivial
        run: scripts/chaos.sh kill-pod
      - name: Caos 2 - Postgres caído (el mercado sigue)
        run: scripts/chaos.sh postgres-down
      - name: Diagnóstico si algo falló
        if: failure()
        run: |
          kubectl -n vibranium-local get pods,pvc,ingress -o wide || true
          kubectl -n vibranium-local get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n vibranium-local describe pvc || true
          kubectl get storageclass,pv || true
          kubectl -n local-path-storage get pods -o wide || true
          kubectl -n local-path-storage logs deploy/local-path-provisioner --tail=60 || true
          kubectl describe node | grep -A12 -E "Allocated resources|Conditions:" || true
          kubectl -n vibranium-local describe pods || true
          kubectl -n vibranium-local logs statefulset/orderbook --tail=200 || true
          kubectl -n ingress-nginx logs deploy/ingress-nginx-controller --tail=100 || true
