# Estado de los objetos de Kubernetes como métricas: reinicios, listo/no listo, y los límites/requests DECLARADOS de cada contenedor.
# Se limita a ESTE namespace (--namespaces) y a 4 tipos de recurso, así sus permisos son un Role (no de clúster).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-state-metrics}
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - --port=8080
            - --namespaces=$(POD_NAMESPACE)
            - --resources=pods,statefulsets,deployments,persistentvolumeclaims
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
