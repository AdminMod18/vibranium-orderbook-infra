# El order book es de UN SOLO ESCRITOR por diseño (secuenciador único + journal en disco + lock de instancia):
# por eso es un StatefulSet de 1 réplica con volumen propio y NO lleva HPA ni réplicas (ver docs/PLATAFORMA.md §3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderbook
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: orderbook
  labels: {app.kubernetes.io/name: orderbook}
spec:
  selector: {app.kubernetes.io/name: orderbook}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: admin, port: 9102, targetPort: admin}   # /metrics y pprof: NO se publica por el ingress (solo Prometheus, ver NetworkPolicy)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderbook
  labels: {app.kubernetes.io/name: orderbook}
spec:
  serviceName: orderbook
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orderbook}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orderbook}
    spec:
      serviceAccountName: orderbook
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30     # apagado ordenado: vaciar la cola y cerrar el journal
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                    # el usuario `app` de la imagen
        runAsGroup: 10001
        fsGroup: 10001                      # el volumen del journal debe ser escribible por ese usuario
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orderbook
          image: ghcr.io/adminmod18/vibranium-orderbook-meli:latest   # lo fija cada overlay (images:)
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9102}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: vibranium-secrets, key: password}}
            - name: DATABASE_URL        # el servidor opera aunque Postgres no esté listo: el historial se pone al día solo
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/orderbook
            - {name: QUEUE_SIZE, value: "10000"}
            - {name: GOMEMLIMIT, value: 3GiB}   # el GC aprieta ANTES del límite del contenedor (docs/DECISIONES.md L20)
            - {name: ADMIN_PORT, value: "9102"}
            - {name: LOG_LEVEL, value: info}
          # Arranque: el journal se reproduce (~8 s por millón de registros): se tolera hasta 5 min antes de matar el pod.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          # Solo recibe tráfico cuando el secuenciador está activo.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}           # sin límite de CPU a propósito: el throttling de CFS añadiría latencia al secuenciador
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # solo escribe en /data
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: journal, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: journal}             # el journal es la fuente de verdad: sobrevive al pod
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
