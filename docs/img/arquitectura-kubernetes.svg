<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1170" width="1800" height="1170" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="1800" height="1170" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" />
<text x="40" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Vibranium Order Book · Plataforma en Kubernetes</text>
<text x="40" y="84" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">Cómo se conecta la infraestructura con la aplicación. Entorno local: kind (1 nodo). Staging y prod usan los mismos manifiestos (Kustomize).</text>
<rect x="40" y="250" width="250" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="54" y="276" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">JMeter · evaluador</text>
<text x="54" y="300" font-size="14" font-weight="400" fill="#334155" text-anchor="start">curl / robots de órdenes</text>
<text x="54" y="321" font-size="14" font-weight="400" fill="#334155" text-anchor="start">→ http://localhost:8080</text>
<rect x="40" y="560" width="250" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="54" y="586" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Navegador</text>
<text x="54" y="610" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Grafana (admin/admin local)</text>
<text x="54" y="631" font-size="14" font-weight="400" fill="#334155" text-anchor="start">→ grafana.localtest.me:8080</text>
<rect x="330" y="110" width="1440" height="1020" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />
<text x="352" y="142" font-size="17" font-weight="700" fill="#334155" text-anchor="start">Cluster Kubernetes · kind (1 nodo) dentro de Docker Desktop</text>
<rect x="360" y="190" width="300" height="640" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" />
<text x="376" y="218" font-size="15" font-weight="700" fill="#475569" text-anchor="start">ns ingress-nginx</text>
<rect x="385" y="240" width="250" height="570" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="399" y="266" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">ingress-nginx-controller</text>
<text x="399" y="290" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Única entrada de tráfico.</text>
<text x="399" y="311" font-size="14" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="399" y="332" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Escucha :80 (el puerto 8080</text>
<text x="399" y="353" font-size="14" font-weight="400" fill="#334155" text-anchor="start">de tu máquina llega aquí).</text>
<text x="399" y="374" font-size="14" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="399" y="395" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Enruta por reglas Ingress:</text>
<text x="399" y="416" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  · cualquier host → orderbook</text>
<text x="399" y="437" font-size="14" font-weight="400" fill="#334155" text-anchor="start">  · grafana.localtest.me → grafana</text>
<text x="399" y="458" font-size="14" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="399" y="479" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Solo publica la API (:8080).</text>
<text x="399" y="500" font-size="14" font-weight="400" fill="#334155" text-anchor="start">NO publica /metrics ni pprof</text>
<text x="399" y="521" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(puerto de administración 9102).</text>
<text x="399" y="542" font-size="14" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="399" y="563" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Métricas propias en :10254</text>
<text x="399" y="584" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(Prometheus las raspa).</text>
<rect x="700" y="150" width="1040" height="840" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" />
<text x="716" y="178" font-size="15" font-weight="700" fill="#475569" text-anchor="start">ns vibranium-local</text>
<text x="880" y="178" font-size="13" font-weight="400" fill="#6366f1" text-anchor="start">Pod Security «restricted» · NetworkPolicy: se deniega todo y solo se abren las rutas dibujadas (NP)</text>
<rect x="730" y="232" width="210" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="744" y="258" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Ingress + Service</text>
<text x="744" y="282" font-size="14" font-weight="400" fill="#334155" text-anchor="start">orderbook :8080</text>
<text x="744" y="303" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(admin :9102 solo interno)</text>
<rect x="1000" y="200" width="380" height="240" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="1014" y="226" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">StatefulSet orderbook-0</text>
<text x="1014" y="252" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="start">1 réplica: es un SOLO ESCRITOR por diseño</text>
<text x="1014" y="280" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">valida · idempotencia · cola acotada (503 si llena)</text>
<text x="1014" y="303" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">secuenciador único: libro + billeteras</text>
<text x="1014" y="326" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">UN fsync del journal por lote → luego responde</text>
<text x="1014" y="349" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">fail-stop si el disco/journal falla</text>
<text x="1014" y="372" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">admin :9102 → /metrics (sin autenticación, interno)</text>
<rect x="1000" y="462" width="240" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
<ellipse cx="1024" cy="493.0" rx="11" ry="14" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="1046" y="490.0" font-size="14.5" font-weight="700" fill="#059669" text-anchor="start">PVC journal 5 Gi</text>
<text x="1046" y="509.0" font-size="12.5" font-weight="400" fill="#065f46" text-anchor="start">fuente de verdad</text>
<rect x="1490" y="200" width="220" height="120" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
<text x="1504" y="226" font-size="16" font-weight="700" fill="#059669" text-anchor="start">StatefulSet postgres-0</text>
<text x="1504" y="250" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Historial y trazabilidad</text>
<text x="1504" y="271" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(órdenes, trades, libro mayor)</text>
<rect x="1490" y="340" width="220" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
<ellipse cx="1514" cy="371.0" rx="11" ry="14" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="1536" y="368.0" font-size="14.5" font-weight="700" fill="#059669" text-anchor="start">PVC datos 5 Gi</text>
<text x="1536" y="387.0" font-size="12.5" font-weight="400" fill="#065f46" text-anchor="start">modelo de lectura</text>
<rect x="730" y="552" width="210" height="92" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="744" y="578" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Ingress + Service</text>
<text x="744" y="602" font-size="14" font-weight="400" fill="#334155" text-anchor="start">grafana :3000</text>
<rect x="1000" y="540" width="380" height="112" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="1014" y="566" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Deployment grafana</text>
<text x="1014" y="590" font-size="14" font-weight="400" fill="#334155" text-anchor="start">2 dashboards provisionados:</text>
<text x="1014" y="611" font-size="14" font-weight="400" fill="#334155" text-anchor="start">aplicación y plataforma</text>
<rect x="1000" y="760" width="380" height="134" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="1014" y="786" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">StatefulSet prometheus-0</text>
<text x="1014" y="810" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Raspa cada 5 s: orderbook :9102,</text>
<text x="1014" y="831" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ingress :10254, kube-state-metrics,</text>
<text x="1014" y="852" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cAdvisor · 13 alertas cargadas</text>
<rect x="1000" y="912" width="240" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
<ellipse cx="1024" cy="943.0" rx="11" ry="14" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="1046" y="940.0" font-size="14.5" font-weight="700" fill="#059669" text-anchor="start">PVC métricas 2 Gi</text>
<text x="1046" y="959.0" font-size="12.5" font-weight="400" fill="#065f46" text-anchor="start">retención 2 días</text>
<rect x="1490" y="770" width="220" height="112" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="1504" y="796" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">kube-state-metrics</text>
<text x="1504" y="820" font-size="14" font-weight="400" fill="#334155" text-anchor="start">estado, reinicios y límites</text>
<text x="1504" y="841" font-size="14" font-weight="400" fill="#334155" text-anchor="start">declarados de cada pod</text>
<rect x="1000" y="1030" width="380" height="74" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
<text x="1014" y="1056" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Nodo · kubelet (cAdvisor)</text>
<text x="1014" y="1080" font-size="14" font-weight="400" fill="#334155" text-anchor="start">CPU, memoria y red reales por pod</text>
<path d="M 290,310 L 385,310" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
<circle cx="338" cy="286" r="14" fill="#2563eb"/>
<text x="338" y="291" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<path d="M 635,282 L 730,282" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
