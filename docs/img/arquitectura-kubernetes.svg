<rect x="664" y="275" width="30" height="19" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" />
<text x="679" y="289" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">NP</text>
<path d="M 940,282 L 1000,282" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
