<text x="1203" y="712" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑥ consulta PromQL :9090</text>
<rect x="1194" y="719" width="30" height="19" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" />
<text x="1209" y="733" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">NP</text>
<path d="M 1380,856 L 1490,856" fill="none" stroke="#d97706" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#a-d97706)"/>
<rect x="1392" y="825" width="67.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="1401" y="842" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑤ :8080</text>
<path d="M 1380,800 L 1425,800 L 1425,392 L 1380,392" fill="none" stroke="#d97706" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#a-d97706)"/>
<rect x="1428" y="543" width="67.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="1437" y="560" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑤ :9102</text>
<rect x="1428" y="567" width="30" height="19" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" />
<text x="1443" y="581" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">NP</text>
<path d="M 1000,790 L 635,790" fill="none" stroke="#d97706" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#a-d97706)"/>
<rect x="786" y="755" width="74.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="795" y="772" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑤ :10254</text>
<path d="M 1300,894 L 1300,1030" fill="none" stroke="#d97706" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#a-d97706)"/>
<rect x="1308" y="955" width="88.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="1317" y="972" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑤ cAdvisor</text>
<rect x="40" y="700" width="282" height="430" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2" />
<text x="54" y="726" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Cómo viaja una orden</text>
<text x="54" y="758" font-size="13" font-weight="600" fill="#334155" text-anchor="start">① JMeter llama a localhost:8080;</text>
<text x="54" y="784" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   kind lo publica en el nodo.</text>
<text x="54" y="810" font-size="13" font-weight="600" fill="#334155" text-anchor="start">② El ingress enruta al Service;</text>
<text x="54" y="836" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   solo él entra al 8080 (NP).</text>
<text x="54" y="862" font-size="13" font-weight="600" fill="#334155" text-anchor="start">③ El pod valida, encola, empareja</text>
<text x="54" y="888" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   y confirma tras UN fsync.</text>
<text x="54" y="914" font-size="13" font-weight="600" fill="#334155" text-anchor="start">④ Lo confirmado se copia a Postgres</text>
<text x="54" y="940" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   (historial), sin bloquear.</text>
<text x="54" y="966" font-size="13" font-weight="600" fill="#334155" text-anchor="start">⑤ Prometheus raspa pod, ingress,</text>
<text x="54" y="992" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   estado de pods y cAdvisor.</text>
<text x="54" y="1018" font-size="13" font-weight="600" fill="#334155" text-anchor="start">⑥ Grafana consulta a Prometheus</text>
<text x="54" y="1044" font-size="13" font-weight="400" fill="#334155" text-anchor="start">   y se ve por el mismo ingress.</text>
