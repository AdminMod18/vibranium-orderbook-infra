<text x="1395" y="261" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">NP</text>
<path d="M 1600,320 L 1600,340" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-059669)"/>
<path d="M 290,612 L 385,612" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#a-d97706)"/>
<rect x="314" y="579" width="25.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="323" y="596" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">⑥</text>
<path d="M 635,598 L 730,598" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#a-d97706)"/>
<rect x="664" y="585" width="30" height="19" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" />
<text x="679" y="599" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">NP</text>
<path d="M 940,598 L 1000,598" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#a-d97706)"/>
<path d="M 1190,652 L 1190,760" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#a-d97706)"/>
